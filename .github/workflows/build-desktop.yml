name: Test and build desktop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for OpenCV and Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Desktop smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python packaging/make_sample_video.py sample.mp4
          python run_desktop.py --smoke-test sample.mp4

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: Crater-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            asset: Crater-macOS-Intel.dmg
          - os: windows-latest
            asset: Crater-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build
        run: pyinstaller --noconfirm packaging/crater.spec
      - name: Sample video
        run: python packaging/make_sample_video.py sample.mp4

      - name: Smoke-test and package (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Crater.app/Contents/MacOS/Crater --smoke-test sample.mp4
          mkdir dmg && cp -R dist/Crater.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Crater -srcfolder dmg -ov -format UDZO "${{ matrix.asset }}"

      - name: Smoke-test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\Crater\Crater.exe -ArgumentList "--smoke-test","sample.mp4" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
          Compress-Archive -Path dist\Crater -DestinationPath "${{ matrix.asset }}"
          choco install innosetup -y --no-progress
          $version = python -c "import crater_app; print(crater_app.__version__)"
          iscc "/DAppVersion=$version" packaging\crater.iss
          Move-Item dist\Crater-Windows-Setup.exe Crater-Windows-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            Crater-Windows-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          # Tags with a hyphen (v0.6.0-beta.1) are pre-releases, so the
          # "latest" download link always points at a stable version.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* $prerelease \
            --title "Crater $GITHUB_REF_NAME" \
            --notes-file packaging/RELEASE_NOTES.md
